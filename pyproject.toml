[project]
name = "sleewave-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=0a0",
    "ytmusicapi>=1.12.4",
]

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
]

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload"
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
